# Публікація прев'ю: main — у корені, develop — у /develop/
name: Pages preview

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - name: Assemble site
        run: |
          mkdir -p _site/develop
          rsync -a --exclude .git --exclude .github --exclude build.mjs main/ _site/
          rsync -a --exclude .git --exclude .github --exclude build.mjs develop/ _site/develop/
          # прев'ю не повинно потрапляти в пошук
          find _site -name '*.html' -exec sed -i 's#<head>#<head>\n  <meta name="robots" content="noindex, nofollow">#' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
