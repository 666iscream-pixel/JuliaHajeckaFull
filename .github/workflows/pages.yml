# Публікація прев'ю: main — у корені, develop — у /develop/
# Сторінки збирає build.mjs з текстів у content/ (статті й кейси редагує адмінка /admin)
name: Pages preview

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: |
          # гілка без package.json містить уже готові сторінки
          for b in main develop; do
            if [ -f "$b/package.json" ]; then (cd "$b" && npm ci --no-audit --no-fund && node build.mjs); fi
          done
      - name: Assemble site
        run: |
          mkdir -p _site/develop
          EX="--exclude .git --exclude .github --exclude .gitignore --exclude build.mjs --exclude content --exclude node_modules --exclude package.json --exclude package-lock.json"
          rsync -a $EX main/ _site/
          rsync -a $EX develop/ _site/develop/
          # прев'ю не повинно потрапляти в пошук
          find _site -name '*.html' -exec sed -i 's#<head>#<head>\n  <meta name="robots" content="noindex, nofollow">#' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
